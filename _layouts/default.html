<!doctype html>
<html lang="en">
{%- include head.html -%}

<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="logo-banner" aria-label="Site banner">
    <div class="container">
      <a class="corner-brand" href="{{ '/' | relative_url }}" aria-label="Nawotech home">
        <span class="corner-square" aria-hidden="true"></span>
        <span class="corner-text">nawotech</span>
      </a>
    </div>
  </header>
  <main id="content">
    {{ content }}
  </main>
  {%- include footer.html -%}
  <div id="photo-lightbox" class="gallery-overlay" hidden role="dialog" aria-modal="true" aria-label="Project photo gallery">
    <button type="button" class="gallery-overlay-backdrop" aria-label="Close"></button>
    <div class="gallery-overlay-inner">
      <div class="gallery-overlay-head">
        <h3 class="gallery-overlay-title"></h3>
        <button type="button" class="gallery-overlay-close">close &times;</button>
      </div>
      <div class="gallery-overlay-grid"></div>
    </div>
  </div>
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>

</html>
