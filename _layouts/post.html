---
layout: default
---
<article class="post">
  <div class="container">
    <header class="post-header">
      <a class="back-link" href="{{ '/#writing' | relative_url }}">&larr; back</a>
      <h1 class="post-title">{{ page.title }}</h1>
      <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
    </header>
    <div class="post-body">
      <div class="prose">
        {{ content }}
      </div>
    </div>
  </div>
</article>
