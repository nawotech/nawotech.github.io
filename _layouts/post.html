---
layout: default
---
<article class="post">
  <div class="container">
    <header class="post-header">
      <a class="back-link" href="{{ '/#writing' | relative_url }}">&larr; back</a>
      {% if page.label and page.label != "" %}
      <span class="post-label">{{ page.label }}</span>
      {% endif %}
      <h1 class="post-title">{{ page.title }}</h1>
      <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
    </header>
  </div>

  {% if page.hero_image and page.hero_image != "" %}
  <figure class="post-hero">
    <img src="{{ page.hero_image | relative_url }}" alt="{{ page.title }}" loading="lazy">
  </figure>
  {% endif %}

  <div class="container">
    <div class="post-body">
      <div class="prose">
        {{ content }}
      </div>
    </div>

    <nav class="post-foot">
      <a class="back-link" href="{{ '/#writing' | relative_url }}">&larr; all notes</a>
      <a class="back-link" href="{{ '/#contact' | relative_url }}">start a project &rarr;</a>
    </nav>
  </div>
</article>
